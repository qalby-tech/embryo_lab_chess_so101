[project]
name = "chess_sim"
version = "0.1.0"
description = "MuJoCo framework for an SO-101 arm playing chess: sim-ready assets, scripted expert, dataset recording"
requires-python = ">=3.10"
dependencies = [
    "mujoco>=3.10",
    "mink>=1.3",
    "python-chess>=1.9",
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.0",
    "pillow>=9.0",
    "imageio[ffmpeg]>=2.30",
]

[tool.setuptools]
packages = ["chess_sim"]

[tool.setuptools.package-data]
chess_sim = ["assets/**/*", "calib/*.json"]
